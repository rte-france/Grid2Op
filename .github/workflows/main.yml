name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*.*.*'

permissions: {}  # deny all by default

jobs:
  manylinux_build:
    name: Build linux ${{ matrix.python.name }} wheel
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      GHA_USE_NODE_20: false
    strategy:
      matrix:
        python:
          # - {
          #   name: cp38,
          #   abi: cp38,
          #   version: '3.8',
          # }
          - {
            name: cp39,
            abi: cp39,
            version: '3.9',
          }
          - {
            name: cp310,
            abi: cp310,
            version: '3.10',
          }
          - {
            name: cp311,
            abi: cp311,
            version: '3.11',
          }
          - {
            name: cp312,
            abi: cp312,
            version: '3.12',
          }
          - {
            name: cp313,
            abi: cp313,
            version: '3.13',
          }

          - {
            name: cp314,
            abi: cp314,
            version: '3.14',
          }

    steps:

      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          submodules: true
          fetch-depth: 0        # needed for setuptools_scm to read tags

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$(pwd)"

      - name: Setup path
        run: echo "/opt/python/${{ matrix.python.name }}-${{ matrix.python.abi }}/bin/" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools build
      
      - name: Rename pyproject_38.toml file (python 3.8)
        if: matrix.python.name == 'cp38'
        run: |
          rm pyproject.toml
          cp pyproject_38.toml pyproject.toml

      - name: Build wheel
        run: |
          python -m build --wheel .

      - name: Install wheel
        run: |
          pip3 install dist/*.whl
          pip freeze

      - name: Check package can be imported
        run: |
          python -c "import grid2op"
          python -c "from grid2op import *"
          python -c "from grid2op.Action._backendAction import _BackendAction"
          
      # - name: Run full tests + code coverage
      #   if: matrix.python.name == 'cp312'
      #   run: |
      #     python -m pip install --upgrade coverage
      #     python -m pip install --find-links=dist/ grid2op[test]
      #     cd grid2op/tests
      #     coverage run -m unittest discover
      #     coverage xml -i 
      
      # - name: Upload coverage
      #   if: matrix.python.name == 'cp312'
      #   uses: actions/upload-artifact@v4
      #   with: 
      #     name: coverage.xml
      #     path: grid2op/tests/*.xml

      - name: List wheel
        run: 
          ls ./dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: grid2op-wheel-${{ matrix.python.name }}
          path: dist/*.whl

  macos_windows_build:
    name: Build ${{ matrix.config.name }} ${{ matrix.python.name }} wheel
    permissions:
      contents: read
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - {
            name: darwin,
            os: macos-latest,
          }
          - {
            name: windows,
            os: windows-2022,
          }
        python:
          # - {
          #   name: cp38,
          #   version: '3.8',
          # }
          - {
            name: cp39,
            version: '3.9',
          }
          - {
            name: cp310,
            version: '3.10',
          }
          - {
            name: cp311,
            version: '3.11',
          }
          - {
            name: cp312,
            version: '3.12',
          }
          - {
            name: cp313,
            version: '3.13',
          }
          - {
            name: cp314,
            version: '3.14',
          }

    steps:

      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python.version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools build

      - name: Rename pyproject_38.toml file (python 3.8 - macos)
        if: ((matrix.python.name == 'cp38') && (matrix.config.name == 'darwin'))
        run: |
          rm pyproject.toml
          cp pyproject_38.toml pyproject.toml

      - name: Rename pyproject_38.toml file (python 3.8 - windows)
        if: ((matrix.python.name == 'cp38') && (matrix.config.name == 'windows'))
        run: |
          del pyproject.toml
          cp pyproject_38.toml pyproject.toml

      - name: Build wheel
        run: python -m build --wheel .

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl --user
          pip freeze

      - name: Check package can be imported
        run: |
          python -c "import grid2op"
          python -c "from grid2op import *"
          python -c "from grid2op.Action._backendAction import _BackendAction"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: grid2op-wheel-${{ matrix.config.name }}-${{ matrix.python.name }}
          path: dist/*.whl

  source_build:
    name: Build tar.gz grid2op file on ${{ matrix.config.name}}
    permissions:
      contents: read
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - {
            name: darwin,
            os: macos-latest,
          }
          - {
            name: windows,
            os: windows-2022,
          }
          - {
            name: linux,
            os: ubuntu-latest,
          }

    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: 3.12

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools build   

      - name: Build tar gz
        run: python -m build --sdist .

      - name: Install tar gz
        shell: bash
        run: |
          python -m pip install dist/*.tar.gz --user
          pip freeze

      - name: Check package can be imported
        run: |
          python -c "import grid2op"
          python -c "from grid2op import *"
          python -c "from grid2op.Action._backendAction import _BackendAction"  

      - name: Upload source archive
        if: (matrix.config.name == 'darwin')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: grid2op-sources
          path: dist/*.tar.gz        
          
  auto_class_in_file:
    name: Test ${{ matrix.config.name }} OS can handle automatic class generation for python ${{matrix.python.version}}
    permissions:
      contents: read
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - {
            name: darwin,
            os: macos-latest,
          }
          # - {
          #   name: windows,
          #   os: windows-2022,
          # }
          - { 
            name: ubuntu,
            os: ubuntu-latest,
          }
        python:
          - {
            name: cp310,
            version: '3.10',
          }  
          - {
            name: cp314,
            version: '3.14',
          }  

    steps:

      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python.version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools gymnasium build

      - name: Build wheel
        run: python -m build --wheel .

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl --user
          pip freeze

      - name: Test the automatic generation of classes in the env folder
        run: |
          python -m unittest grid2op/tests/automatic_classes.py -v -f
  
  package:
    name: Test install
    runs-on: ubuntu-latest
    needs: [manylinux_build, macos_windows_build, auto_class_in_file]

    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: download

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: grid2op-wheels
          path: |
            download/**/*.whl
            download/**/*.tar.gz
